type Type {
  id: Int!
  name: String!
  created_at: String!
}

type Pokemon {
  id: Int!
  name: String!
  types: [Type!]!
  created_at: String!
}

type PokemonAlreadyExistsError {
  message: String!
}

type PokemonNotFoundError {
  message: String!
}

input CreatePokemonInput {
  id: Int!
  name: String!
  types: [String!]!
}

input UpdatePokemonInput {
  id: Int!
  name: String
  types: [String!]
}

input PokemonFilterInput {
  type: String
  name: String
}

input PaginationInput {
  page: Int
  limit: Int
}

input SortInput {
  sortBy: String
  sortOrder: String
}

type PaginationMetadata {
  page: Int!
  limit: Int!
  totalCount: Int!
  totalPages: Int!
}

type PokemonListResult {
  data: [Pokemon!]!
  pagination: PaginationMetadata!
}

union CreatePokemonResult = Pokemon | PokemonAlreadyExistsError

type Query {
  pokemons(
    filter: PokemonFilterInput
    pagination: PaginationInput
    sort: SortInput
  ): PokemonListResult!
}

type Mutation {
  createPokemon(input: CreatePokemonInput!): CreatePokemonResult!
  updatePokemon(input: UpdatePokemonInput!): Pokemon!
  deletePokemon(id: Int!): Boolean!
  importPokemon(id: Int!): Pokemon!
}
